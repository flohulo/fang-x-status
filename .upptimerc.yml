# Konfiguration der Fang-X-Statusseite (Upptime, https://upptime.js.org/docs/configuration).
# Nur diese Datei bearbeiten: Die Workflows in .github/workflows werden daraus erzeugt.
owner: flohulo
repo: fang-x-status

# Bei einer Störung legt Upptime ein Issue an und weist es diesen Personen zu.
assignees:
  - flohulo

sites:
  - name: Fang X App
    url: https://fang-x.freizeit.workers.dev/
  - name: Webseite und Handbuch
    url: https://flohulo.github.io/fang-x/

status-website:
  # Ohne eigene Domain läuft die Seite unter https://flohulo.github.io/fang-x-status/
  baseUrl: /fang-x-status
  logoUrl: https://flohulo.github.io/fang-x/favicon.svg
  favicon: https://flohulo.github.io/fang-x/favicon.svg
  name: Fang X Status
  introTitle: "Status und Neuigkeiten von **Fang X**"
  introMessage: >-
    Hier siehst du, ob Fang X gerade läuft und ob eine Störung bekannt ist. Störungen werden
    automatisch erkannt und gemeldet. Geplante Wartungen und Neuigkeiten findest du ebenfalls hier.
    Was sich in neuen Versionen geändert hat, steht im
    [Changelog](https://github.com/flohulo/fang-x/blob/main/CHANGELOG.md).
    Fehler meldest du am besten über [GitHub](https://github.com/flohulo/fang-x/issues/new/choose).
  navbar:
    - title: Status
      href: https://flohulo.github.io/fang-x-status/
    - title: Jetzt spielen
      href: https://fang-x.freizeit.workers.dev/
    - title: Handbuch
      href: https://flohulo.github.io/fang-x/handbuch/
    - title: GitHub
      href: https://github.com/flohulo/fang-x

# Deutsche Texte für die Statusseite. Nicht aufgeführte Texte bleiben englisch.
i18n:
  activeIncidents: Aktuelle Störungen
  allSystemsOperational: Alles läuft
  incidentReport: "Störung #$NUMBER"
  activeIncidentSummary: Seit $DATE, $POSTS Beiträge
  anIncidentReport: Störungsbericht
  pastIncidents: Vergangene Störungen
  pastIncidentsResolved: Behoben nach $MINUTES Minuten, $POSTS Beiträge
  liveStatus: Live-Status
  overallUptime: "Verfügbarkeit gesamt: $UPTIME"
  averageResponseTime: "Durchschnittliche Antwortzeit: $TIME ms"
  up: Läuft
  down: Ausgefallen
  degraded: Langsam
  scheduledMaintenance: Geplante Wartung
  pastScheduledMaintenance: Vergangene Wartungen
  duration: Dauer
  navGitHub: GitHub
  footer: Diese Seite ist [Open Source]($REPO) und wird mit [Upptime](https://upptime.js.org) betrieben.
